
model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  max_seq_length: 512

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  compute_dtype: "float16"
  use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  epochs: 2
  warmup_ratio: 0.03
  logging_steps: 10
  seed: 42

dataset:
  cycle_1: "data/processed/train_batch1.jsonl"
  cycle_2: "data/processed/train_batch2.jsonl"
  validation: "data/processed/validation.jsonl"
  test: "data/processed/test.jsonl"

output:
  adapter_directory: "models/"
